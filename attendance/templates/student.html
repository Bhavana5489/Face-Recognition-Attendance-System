<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Student Check-in - GazePass</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=7">
</head>
<body class="student-body">
    <header>
        <div class="nav-container">
            <a href="/student" class="logo">
                <svg class="icon" viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg>
                GAZEPASS | Terminal
            </a>
            <div class="nav-links">
                <a href="/" class="nav-btn">Back to Home</a>
            </div>
        </div>
    </header>

    <div class="student-layout">
        <div class="camera-container" id="student-camera">
            <img src="{{ url_for('video_feed') }}" id="streamImg" alt="Live Attendance Feed">
            <div class="face-guide"></div>
            <!-- The gaze dot is injected dynamically, but the server handles overlaying it on the stream directly in this implementation, 
                 so we don't strictly need a CSS dot here unless we want client-side visuals. The backend draws it. -->
        </div>
        
        <div class="feedback-drawer state-idle" id="student-drawer">
            <div class="state-icon" id="drawer-icon">
                <svg viewBox="0 0 24 24" class="icon"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
            </div>
            <div>
                <div class="feedback-title" id="drawer-title">Ready</div>
                <div class="feedback-desc" id="statusBadge">Please step in front of the camera.</div>
            </div>
            
            <div style="width: 100%; text-align: left; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border);">
                <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                    <span style="color: var(--text-muted); font-size: 0.85rem;">Student:</span>
                    <strong style="color: var(--text-main);" id="profileName">Searching...</strong>
                </div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                    <span style="color: var(--text-muted); font-size: 0.85rem;">Gaze:</span>
                    <strong style="color: var(--text-main);" id="gazeDir">N/A</strong>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.25rem;">
                    <span style="color: var(--text-muted); font-size: 0.85rem;">Challenge Progress:</span>
                    <span style="font-size: 0.85rem; font-weight: 500;" id="progressText">0 / 2</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="progressBar" class="progress-bar-fill"></div>
                </div>
            </div>

            <button class="btn btn-secondary" onclick="resetStudentPortal()" style="width: 100%; margin-top: 1rem;">
                Reset / Next Student
            </button>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        let pollInterval = null;
        let toastShown = false;
        let audioPlayed = false;

        const stateIcons = {
            'idle': '<svg viewBox="0 0 24 24" class="icon"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>',
            'scanning': '<svg viewBox="0 0 24 24" class="icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>',
            'success': '<svg viewBox="0 0 24 24" class="icon"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>',
            'error': '<svg viewBox="0 0 24 24" class="icon"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>'
        };

        function setUIState(stateName, title, desc) {
            const drawer = document.getElementById('student-drawer');
            const camera = document.getElementById('student-camera');
            
            drawer.className = 'feedback-drawer state-' + stateName;
            if(stateName === 'scanning') {
                camera.classList.add('camera-state-scanning');
            } else {
                camera.classList.remove('camera-state-scanning');
            }
            
            document.getElementById('drawer-icon').innerHTML = stateIcons[stateName];
            document.getElementById('drawer-title').innerText = title;
            document.getElementById('statusBadge').innerText = desc;
        }

        function playSuccessSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gainNode = ctx.createGain();
                osc.connect(gainNode);
                gainNode.connect(ctx.destination);
                osc.type = "sine";
                osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
                osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.1, ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.8);
                osc.start();
                osc.stop(ctx.currentTime + 0.8);
            } catch(e) {}
        }

        function showToast(msg, type='success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <svg class="icon" viewBox="0 0 24 24">
                    ${type === 'success' ? '<polyline points="20 6 9 17 4 12"></polyline>' : '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>'}
                </svg>
                <div>${msg}</div>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        async function initStudentAttendance() {
            try {
                toastShown = false;
                audioPlayed = false;
                await fetch('/api/start_attendance', { method: 'POST' });
                if (pollInterval) clearInterval(pollInterval);
                pollInterval = setInterval(pollStatus, 300);
                setUIState('idle', 'Ready', 'Please step in front of the camera.');
            } catch (err) {
                console.error("Error starting attendance marking:", err);
            }
        }

        async function resetStudentPortal() {
            try {
                await fetch('/api/stop_attendance', { method: 'POST' });
                setUIState('idle', 'Resetting...', 'Preparing for next student.');
                setTimeout(() => {
                    initStudentAttendance();
                }, 300);
            } catch(e) {}
        }

        async function pollStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();

                const profileName = document.getElementById('profileName');
                const gazeDir = document.getElementById('gazeDir');
                const progressText = document.getElementById('progressText');
                const progressBar = document.getElementById('progressBar');

                profileName.innerText = data.recognized.replace(/_/g, ' ');
                gazeDir.innerText = data.gaze;

                if (data.state === "mark") {
                    if (data.recognized === "Unknown") {
                        setUIState('idle', 'Align Face', 'Move closer into the frame.');
                        progressText.innerText = `0 / ${data.total_waypoints || 3}`;
                        progressBar.style.width = "0%";
                        progressBar.style.background = "var(--primary)";
                    } else {
                        setUIState('scanning', 'Liveness Check', 'Look at the moving dot on the screen.');
                        const wp = data.waypoint || 0;
                        const total = data.total_waypoints || 3;
                        progressText.innerText = `${wp} / ${total}`;
                        progressBar.style.width = `${(wp / total) * 100}%`;
                        progressBar.style.background = "var(--primary)";
                    }
                } else if (data.state === "success_feedback") {
                    if (!toastShown) {
                        playSuccessSound();
                        showToast(`Attendance marked successfully for ${data.recognized.replace(/_/g, ' ')}!`, 'success');
                        toastShown = true;
                    }
                    setUIState('success', 'Verified', 'Attendance marked successfully.');
                    const total = data.total_waypoints || 3;
                    progressText.innerText = `${total} / ${total}`;
                    progressBar.style.width = "100%";
                    progressBar.style.background = "var(--success)";
 
                    setTimeout(() => {
                        if (toastShown) resetStudentPortal();
                    }, 3500);
                } else if (data.state === "fail_feedback") {
                    if (!audioPlayed) {
                        showToast("Verification failed. Please look at the moving dot carefully.", "error");
                        audioPlayed = true;
                    }
                    setUIState('error', 'Verification Failed', 'Face not clearly visible or challenge failed.');
                    progressText.innerText = `0 / ${data.total_waypoints || 3}`;
                    progressBar.style.width = "0%";
                    progressBar.style.background = "var(--danger)";
                } else {
                    setUIState('idle', 'Ready', 'Please step in front of the camera.');
                }
            } catch(err) {
                console.error("Error polling status:", err);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initStudentAttendance();
        });
    </script>
</body>
</html>
